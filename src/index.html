<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <div id ="header">
      <img id="header-logo" src="assets/tauri.svg" alt="Logo">
      <ul>
        <li id="file" class="header-item">File</li>
        <li id="edit" class="header-item">Edit</li>
        <li id="view" class="header-item">View</li>
        <li id="tools" class="header-item">Tools</li>
      </ul>
    </div>
    <div id="taskbar">
      <div id="taskbar-content">
        Select A Task From The Header.
      </div>
    </div>

    <div id="left">
      <div id="left-content">
        <H1>PANE</H1>
        <img id="orgate" class="gate" src="assets/gates/or.svg" draggable="false" data-gate="or">
        <img id="andgate" class="gate" src="assets/gates/and.svg" draggable="false" data-gate="and">
        
        
        <div>GateWorks</div>
        <div>GateWorks</div>
        <div>GateWorks</div>
        <div>GateWorks</div>
        <div>GateWorks</div>
        <div>GateWorks</div>
        <div>GateWorks</div>
        <div>GateWorks</div>
        <div>GateWorks</div>
        <div>GateWorks</div>
        <div>GateWorks</div>
        <div>GateWorks</div>
        <div>GateWorks</div>
        <div>GateWorks</div>
        <div>GateWorks</div>
        <div>GateWorks</div>
        <div>GateWorks</div>
        <div>GateWorks</div>
        
      </div>
      <div id="left-resizer"></div>
    </div>

    <div id="right">
      <div id="right-content"> 

        <svg id="workspace">

          <defs>
            <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
              <path id="grid-lines" d="M 25 0 L 0 0 0 25" />
            </pattern>
          </defs>
      
          <rect id="grid-background" width="100%" height="100%" />
        </svg>

      </div>
    </div>

    <main>
      
    </main>
  </body>
</html>
